title: Нелинейная динамика в ускорителях
author: Федоров Вячеслав Васильевич, м.н.с. ИЯФ им. Г. И. Будкера СО РАН
copyright: "2026"
logo: ""

only_build_toc_files: true

exclude_patterns:
  - .venv
  - _build
  - .git
  - "**.ipynb_checkpoints"
  - README.md

execute:
  execute_notebooks: cache
  timeout: 300
  allow_errors: false

parse:
  myst_enable_extensions:
    - amsmath
    - dollarmath
    - colon_fence
    - deflist
    - html_image
    - substitution

sphinx:
  config:
    language: ru
    html_show_copyright: false
    nb_merge_streams: true
    # предупреждения matplotlib и т. п. не показываем читателю
    nb_output_stderr: remove
    # В тетрадях формулы $$...$$ стоят внутри абзацев, без пустых строк вокруг,
    # как принято в Jupyter; без этой опции MyST разбирает их как инлайн-$ и ломает вёрстку
    myst_dmath_double_inline: true

html:
  use_issues_button: false
  use_repository_button: true
  use_edit_page_button: false
  home_page_in_navbar: true

repository:
  url: https://github.com/phys-dev/nonlinear-dynamics-book
  branch: main
